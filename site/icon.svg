<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Pier app icon: a pier in silhouette on a twilight sea, its lamps lit —
       each lamp a listening port. Apple's macOS grid: an 824pt body at 100,
       with the drop shadow inside the canvas. -->
  <defs>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a3d"/>
      <stop offset="0.42" stop-color="#2c2a5c"/>
      <stop offset="0.66" stop-color="#7a4a74"/>
      <stop offset="0.8" stop-color="#e58a6e"/>
      <stop offset="0.86" stop-color="#f7c27f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3f73"/>
      <stop offset="0.35" stop-color="#1d2550"/>
      <stop offset="1" stop-color="#0b1130"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe2a3" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffc56b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb055" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e58a6e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e58a6e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="piling-reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e24" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0a0e24" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="#151a3d"/>
  </g>

  <g clip-path="url(#body)">
    <!-- sky down to the horizon at y=640 -->
    <rect x="100" y="100" width="824" height="540" fill="url(#sky)"/>
    <!-- two early stars -->
    <circle cx="742" cy="232" r="5" fill="#fff4dc" opacity="0.85"/>
    <circle cx="830" cy="318" r="3.5" fill="#fff4dc" opacity="0.6"/>

    <!-- sea -->
    <rect x="100" y="640" width="824" height="284" fill="url(#sea)"/>
    <!-- the horizon's light, broken on the swell -->
    <g fill="#f7c27f">
      <rect x="560" y="654" width="300" height="5" rx="2.5" opacity="0.55"/>
      <rect x="620" y="676" width="190" height="4" rx="2" opacity="0.35"/>
      <rect x="660" y="700" width="110" height="4" rx="2" opacity="0.22"/>
    </g>

    <!-- the horizon's warmth on the near water -->
    <rect x="100" y="640" width="824" height="90" fill="url(#warm)"/>

    <!-- lamp reflections, broken by the swell, fading with distance down -->
    <g fill="#ffd38a">
      <g opacity="0.8">
        <rect x="248" y="736" width="22" height="9" rx="4.5"/>
        <rect x="252" y="756" width="14" height="7" rx="3.5"/>
        <rect x="246" y="774" width="20" height="6" rx="3"/>
        <rect x="254" y="792" width="12" height="5" rx="2.5"/>
        <rect x="250" y="810" width="10" height="4" rx="2" opacity="0.6"/>
      </g>
      <g opacity="0.7">
        <rect x="428" y="736" width="22" height="9" rx="4.5"/>
        <rect x="433" y="756" width="14" height="7" rx="3.5"/>
        <rect x="430" y="774" width="18" height="6" rx="3"/>
        <rect x="436" y="792" width="10" height="5" rx="2.5" opacity="0.6"/>
      </g>
      <g opacity="0.6">
        <rect x="608" y="736" width="22" height="9" rx="4.5"/>
        <rect x="612" y="756" width="14" height="7" rx="3.5"/>
        <rect x="610" y="774" width="16" height="6" rx="3" opacity="0.6"/>
      </g>
    </g>

    <!-- the pier, from off the left edge out over the water -->
    <g fill="#0a0e24">
      <!-- deck -->
      <rect x="40" y="598" width="680" height="30" rx="8"/>
      <!-- rail -->
      <rect x="40" y="548" width="650" height="9" rx="4.5"/>
      <rect x="140" y="548" width="9" height="56" rx="4.5"/>
      <rect x="320" y="548" width="9" height="56" rx="4.5"/>
      <rect x="500" y="548" width="9" height="56" rx="4.5"/>
      <rect x="681" y="548" width="9" height="56" rx="4.5"/>
      <!-- pilings, into the water -->
      <rect x="160" y="620" width="20" height="104" rx="3"/>
      <rect x="340" y="620" width="20" height="104" rx="3"/>
      <rect x="520" y="620" width="20" height="104" rx="3"/>
      <rect x="682" y="620" width="20" height="104" rx="3"/>
      <!-- lamp posts -->
      <rect x="254" y="430" width="10" height="170" rx="5"/>
      <rect x="434" y="430" width="10" height="170" rx="5"/>
      <rect x="614" y="430" width="10" height="170" rx="5"/>
    </g>

    <!-- lamps -->
    <g>
      <circle cx="259" cy="420" r="84" fill="url(#glow)"/>
      <circle cx="439" cy="420" r="84" fill="url(#glow)"/>
      <circle cx="619" cy="420" r="84" fill="url(#glow)"/>
      <g fill="#fff1c9">
        <circle cx="259" cy="420" r="15"/>
        <circle cx="439" cy="420" r="15"/>
        <circle cx="619" cy="420" r="15"/>
      </g>
    </g>

    <!-- pilings mirrored in the water below the line where they meet it -->
    <g fill="url(#piling-reflection)">
      <rect x="160" y="724" width="20" height="70"/>
      <rect x="340" y="724" width="20" height="70"/>
      <rect x="520" y="724" width="20" height="70"/>
      <rect x="682" y="724" width="20" height="70"/>
    </g>
  </g>
</svg>
