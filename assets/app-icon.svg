<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Pier app icon: dusk-blue rounded square, warm deck, teal waves. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0d4f5c"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead2"/>
      <stop offset="1" stop-color="#e6d3b0"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <g transform="translate(112 150) scale(12.5)">
    <!-- lamp post + warm lamp -->
    <rect x="49" y="8" width="5" height="12" rx="2" fill="#e6d3b0"/>
    <circle cx="51.5" cy="6.5" r="4.5" fill="#ffd97a"/>
    <!-- deck -->
    <rect x="5" y="20" width="54" height="7" rx="3.5" fill="url(#deck)"/>
    <!-- pilings -->
    <g fill="#d8c39c">
      <rect x="9"  y="27" width="6" height="21" rx="2"/>
      <rect x="22" y="27" width="6" height="21" rx="2"/>
      <rect x="35" y="27" width="6" height="21" rx="2"/>
      <rect x="48" y="27" width="6" height="21" rx="2"/>
    </g>
    <!-- waves -->
    <g fill="none" stroke="#7fd4c1" stroke-width="5" stroke-linecap="round">
      <path d="M7 55 q5 -5 10 0 q5 5 10 0"/>
      <path d="M33 55 q5 -5 10 0 q5 5 10 0"/>
      <path d="M20 61.5 q5 -5 10 0 q5 5 10 0"/>
    </g>
  </g>
</svg>
