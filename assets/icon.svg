<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pier: side-view boardwalk. Solid black; alpha defines the shape (template icon). -->
  <g fill="#000000">
    <!-- lamp post -->
    <rect x="49" y="8" width="5" height="12" rx="2"/>
    <circle cx="51.5" cy="6.5" r="4.5"/>
    <!-- deck -->
    <rect x="5" y="20" width="54" height="7" rx="3.5"/>
    <!-- pilings -->
    <rect x="9"  y="27" width="6" height="21" rx="2"/>
    <rect x="22" y="27" width="6" height="21" rx="2"/>
    <rect x="35" y="27" width="6" height="21" rx="2"/>
    <rect x="48" y="27" width="6" height="21" rx="2"/>
  </g>
  <!-- waves beneath the water line -->
  <g fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round">
    <path d="M7 55 q5 -5 10 0 q5 5 10 0"/>
    <path d="M33 55 q5 -5 10 0 q5 5 10 0"/>
    <path d="M20 61.5 q5 -5 10 0 q5 5 10 0"/>
